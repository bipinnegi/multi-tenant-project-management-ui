<div class="app-shell">

  <!-- Navbar: full width, never shifts -->
  <app-navbar (menuToggle)="toggleSidebar()"></app-navbar>

  <!-- Below navbar: sidebar + content side by side -->
  <div class="below-navbar">

    <!-- Mobile backdrop -->
    @if (isMobileBackdropVisible) {
      <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
    }

    <!-- Sidebar -->
    <app-sidebar
      [isPinned]="isSidebarOpen"
      [class.open]="isSidebarOpen">
    </app-sidebar>

    <!-- Page content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
