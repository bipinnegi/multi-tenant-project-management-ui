@if (isLoggedIn) {
  <nav class="navbar">
    <div class="navbar-left">
      <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Open menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg>
      </button>
      <a class="navbar-link" routerLink="/status-overview" routerLinkActive="active">Status Overview</a>
      <a class="navbar-link" routerLink="/projects" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Projects</a>
    </div>
    <div class="navbar-actions">
      <div class="user-menu">
        <div class="user-avatar">{{ isOwner ? 'O' : 'M' }}</div>
        <span class="user-role">{{ isOwner ? 'Owner' : 'Member' }}</span>
        <span class="user-chevron">▾</span>
      </div>
    </div>
  </nav>
}
