@if (isLoggedIn) {
  <nav class="navbar">

    <!-- Left: Context / Page title -->
     
    <a class="navbar-brand" routerLink="/projects">
      Projects
    </a>

    <!-- Right: User actions -->
    <div class="navbar-actions">

      <!-- User info (avatar + role) -->
      <div class="user-menu">
        <div class="user-avatar">
          {{ isOwner ? 'O' : 'M' }}
        </div>

        <span class="user-role">
          {{ isOwner ? 'Owner' : 'Member' }}
        </span>

        <span class="user-chevron">▾</span>
      </div>

    </div>

  </nav>
}
