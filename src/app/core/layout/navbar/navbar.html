@if (isLoggedIn) {
  <nav class="navbar">
    <div class="navbar-left">

      <!-- 1. Hamburger -->
      <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg>
      </button>

      <!-- 2. Brand logo -->
      <img src="/branding/jira-logo.svg" alt="Logo" class="navbar-brand-logo" />

      <!-- 3. Brand name -->
      <span class="navbar-brand-name">Projex<span class="brand-suffix">Flow</span></span>

      <!-- 4. Divider -->
      <span class="navbar-divider"></span>

      <!-- 5. Workspace label - LEFT side after brand -->
      <span class="workspace-label">{{ userName }}'s workspace</span>

    </div>

    <!-- Right side: user menu only -->
    <div class="navbar-actions">
      <div class="user-menu">
        <div class="user-avatar">{{ isOwner ? 'O' : 'M' }}</div>
        <span class="user-role">{{ isOwner ? 'Owner' : 'Member' }}</span>
        <span class="user-chevron">&#9662;</span>
      </div>
    </div>
  </nav>
}
