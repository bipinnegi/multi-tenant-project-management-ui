<div class="jira-login-wrapper">

  <!-- Theme toggle -->
  <button
    class="theme-toggle"
    type="button"
    (click)="toggleTheme()"
    aria-label="Toggle theme"
  >
    <img
      *ngIf="!isDark"
      src="branding/dark.svg"
      class="theme-icon"
      alt="Enable dark mode"
    />
    <img
      *ngIf="isDark"
      src="branding/light.svg"
      class="theme-icon theme-icon-dark"
      alt="Enable light mode"
    />
  </button>

  <!-- LEFT PANEL -->
  <div class="jira-left">

    <!-- Brand -->
    <div class="jira-brand">
      <img src="/branding/jira-logo.svg" alt="Logo" />
      <span>Project <span class="bl-text">Flow</span></span>
    </div>

    <!-- Heading -->
    <h1>Create your <span class="bl-text">workspace</span></h1>
    <p class="jira-subtitle">
      Set up your team’s project space in minutes.
    </p>

    <!-- FORM -->
    <form (ngSubmit)="register()" class="jira-form">

      <label>Workspace name</label>
      <input
        type="text"
        name="tenantName"
        placeholder="e.g. Acme Inc"
        [(ngModel)]="tenantName"
        required
      />

      <label>Your full name</label>
      <input
        type="text"
        name="ownerName"
        placeholder="e.g. John Doe"
        [(ngModel)]="ownerName"
        required
      />

      <label>Work email</label>
      <input
        type="email"
        name="email"
        placeholder="you@company.com"
        [(ngModel)]="email"
        required
      />

      <label>Password</label>
      <input
        type="password"
        name="password"
        placeholder="Create a secure password"
        [(ngModel)]="password"
        required
      />

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading"
      >
        {{ loading ? 'Creating workspace…' : 'Create workspace' }}
      </button>
    </form>

    <!-- ERROR -->
    @if (errorMessage) {
      <div class="error-box">
        {{ errorMessage }}
      </div>
    }

  </div>

  <!-- RIGHT PANEL -->
  <div class="jira-right">
    <img
      src="/branding/jira-preview.svg"
      alt="Preview"
      class="preview-img"
    />
  </div>

</div>
