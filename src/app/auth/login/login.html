<div class="jira-login-wrapper">

  <!-- THEME TOGGLE -->
  <button
    class="theme-toggle"
    (click)="toggleDarkMode()"
    aria-label="Toggle dark mode"
  >
    <!-- Dark mode icon -->
    <img
      *ngIf="!isDarkMode"
      src="branding/dark.svg"
      alt="Enable dark mode"
      class="theme-icon"
    />

    <!-- Light mode icon -->
    <img
      *ngIf="isDarkMode"
      src="branding/light.svg"
      alt="Enable light mode"
      class="theme-icon theme-icon-dark"
    />
  </button>

  <!-- LEFT PANEL -->
  <div class="jira-left">
    <div class="jira-brand">
      <img
        src="branding/jira-logo.svg"
        alt="Logo"
        class="brand-logo"
      />
      <span>Project<span class="bl-text">Flow</span></span>
    </div>

    <h1>Where your <span class="bl-text">teams</span><br />work together</h1>

    <form (ngSubmit)="login()" class="jira-form">
      <label>Work email</label>
      <input
        type="email"
        placeholder="you@company.com"
        [(ngModel)]="email"
        name="email"
        required
      />

      <label>Password</label>
      <input
        type="password"
        placeholder="••••••••"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit" class="btn-primary">
        Log in
      </button>
    </form>

    <div *ngIf="error" class="error-box">
      {{ error }}
    </div>

    <div class="jira-footer">
      <span>Don’t have an account?</span>
      <a routerLink="/register">Sign up</a>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="jira-right">
    <img
      src="branding/jira-preview.svg"
      alt="Preview"
      class="preview-img"
    />
  </div>

</div>
