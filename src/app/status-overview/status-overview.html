<div class="overview-page">

  <!-- STATUS OVERVIEW CARD -->
  <div class="overview-card">
       <div class="overview-header">
         <h3>Status overview</h3>
         <p class="subtitle">
           Get a snapshot of the status of your work items.
         </p>
       </div>
      <div class="status">
       @if (loading) {
         <div class="loading">Loading status...</div>
       }

       @if (!loading) {
         <div class="overview-content">

        <!-- Donut Chart -->
        <svg width="180" height="180" viewBox="0 0 36 36" class="donut">
          <!-- Background -->
          <circle
            cx="18"
            cy="18"
            r="15.9155"
            fill="transparent"
            stroke="#DFE1E6"
            stroke-width="3"
          />

          <!-- Todo -->
          <circle
            cx="18"
            cy="18"
            r="15.9155"
            fill="transparent"
            stroke="#0052CC"
            stroke-width="3"
            [attr.stroke-dasharray]="todoPercent + ' ' + (100 - todoPercent)"
            stroke-dashoffset="25"
          />

          <!-- In Progress -->
          <circle
            cx="18"
            cy="18"
            r="15.9155"
            fill="transparent"
            stroke="#FFAB00"
            stroke-width="3"
            [attr.stroke-dasharray]="inProgressPercent + ' ' + (100 - inProgressPercent)"
            [attr.stroke-dashoffset]="25 - todoPercent"
          />

          <!-- Done -->
          <circle
            cx="18"
            cy="18"
            r="15.9155"
            fill="transparent"
            stroke="#36B37E"
            stroke-width="3"
            [attr.stroke-dasharray]="donePercent + ' ' + (100 - donePercent)"
            [attr.stroke-dashoffset]="25 - todoPercent - inProgressPercent"
          />

          <!-- Center text -->
          <text x="18" y="18" text-anchor="middle" dy=".3em" class="donut-text">
            {{ total }}
          </text>
        </svg>

        <!-- Legend -->
        <div class="legend">
          <div class="legend-item">
            <span class="dot todo"></span>
            To Do: {{ todo }}
          </div>
          <div class="legend-item">
            <span class="dot in-progress"></span>
            In Progress: {{ inProgress }}
          </div>
          <div class="legend-item">
            <span class="dot done"></span>
            Done: {{ done }}
          </div>
        </div>

      </div>
    }
    </div>
  </div>

  <!-- RECENT ACTIVITY -->
  <div class="activity-card">
    <h4>Recent activity</h4>
    <p class="subtitle">
      Stay up to date with what's happening across the space.
    </p>

    <div class="activity-empty">
      No recent activity yet.
    </div>
  </div>

</div>
