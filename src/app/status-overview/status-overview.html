<div class="overview-page">

  <!-- STATUS OVERVIEW CARD -->
  <div class="overview-card">
    <div class="overview-header">
      <h3>Status overview</h3>
      <p class="subtitle">
        Get a snapshot of the status of your work items.
        <a href="#" class="link">View all work items</a>
      </p>
    </div>

    <div class="overview-content">
      <!-- Donut placeholder -->
      <div class="donut-placeholder">
        <div class="donut-center">
          <strong>3</strong>
          <span>Total work items</span>
        </div>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item">
          <span class="dot in-progress"></span>
          In Progress: 1
        </div>
        <div class="legend-item">
          <span class="dot todo"></span>
          To Do: 2
        </div>
      </div>
    </div>
  </div>

  <!-- RECENT ACTIVITY -->
  <div class="activity-card">
    <h4>Recent activity</h4>
    <p class="subtitle">
      Stay up to date with what's happening across the space.
    </p>

    <!-- Empty placeholder for future -->
    <div class="activity-empty">
      No recent activity yet.
    </div>
  </div>

</div>
