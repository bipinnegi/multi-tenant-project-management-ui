<div class="container mt-4">
  <h3>Accept Invitation</h3>

  @if (successMessage) {
    <div class="alert alert-success">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
  }

  <div class="card mt-3">
    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="FullName"
          placeholder="Your full name"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Create a password"
        />
      </div>

      <button class="btn btn-success" (click)="acceptInvitation()">
        Accept Invitation
      </button>

    </div>
  </div>
</div>
