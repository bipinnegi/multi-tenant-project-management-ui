<div class="accept-wrapper">
  <div class="accept-card">
    <div class="accept-brand">
      <img src="branding/jira-logo.svg" alt="Logo" class="brand-logo" />
      <span class="brand-name">Project<span class="brand-suffix">Flow</span></span>
    </div>
    <h2>Accept Invitation</h2>
    <p class="accept-subtitle">Complete your account setup to join the workspace.</p>

    @if (successMessage) { <div class="alert success">{{ successMessage }}</div> }
    @if (errorMessage) { <div class="alert error">{{ errorMessage }}</div> }

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="FullName" placeholder="Your full name" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Create a password" />
    </div>
    <button class="accept-btn" (click)="acceptInvitation()">Accept & Join Workspace</button>
  </div>
</div>
