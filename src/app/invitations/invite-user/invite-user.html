<div class="invite-wrapper">

  <div class="invite-card">

    <!-- LEFT: Illustration -->
    <div class="invite-illustration">
      <img
        src="branding/invite.png"
        alt="Invite illustration"
      />
    </div>

    <!-- RIGHT: Form -->
    <div class="invite-form">

      <h2>Invite user</h2>
      <p class="subtitle">
        Invite a new member to your company workspace.
      </p>

      @if (successMessage) {
        <div class="alert success">{{ successMessage }}</div>
      }

      @if (errorMessage) {
        <div class="alert error">{{ errorMessage }}</div>
      }

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="user@example.com"
        />
      </div>

      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="role">
          <option value="Member">Member</option>
        </select>
      </div>

      <button
        class="primary-btn"
        (click)="invite()"
        [disabled]="loading"
      >
        {{ loading ? 'Sending…' : 'Send invitation' }}
      </button>

      @if (inviteLink) {
        <div class="invite-link-box">
          <label>Invite link</label>
          <div class="invite-link">
            <input [value]="inviteLink" readonly />
            <button class="secondary-btn" (click)="copyLink()">Copy</button>
          </div>
        </div>
      }

    </div>
  </div>

</div>
