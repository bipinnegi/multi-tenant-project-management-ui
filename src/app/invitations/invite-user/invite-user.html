<div class="container mt-4">
  <h3>Invite User</h3>

  <!-- SUCCESS MESSAGE -->
  @if (successMessage) {
    <div class="alert alert-success">
      {{ successMessage }}
    </div>
  }

  <!-- ERROR MESSAGE -->
  @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
  }

  <div class="card mt-3">
    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="user@example.com"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Role</label>
        <select class="form-select" [(ngModel)]="role">
          <option value="Member">Member</option>
        </select>
      </div>

      <button class="btn btn-primary" (click)="invite()">
        Send Invitation
      </button>

    </div>
  </div>
</div>
